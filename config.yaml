# Example ESPHome config — HEUNGELECTRIC ESP32 + LAN8720
# eth_wifi_fallback: Ethernet → WiFi STA → AP rescue + NVS

esphome:
  name: heung-eth-fallback
  friendly_name: HEUNG Ethernet + WiFi Fallback

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      enable_lwip_dhcp_server: true
      # minimum_chip_revision: "3.0"
      # sram1_as_iram: true

external_components:
  - source: github://kemak92/eth_wifi_fallback_ap@main
    components: [eth_wifi_fallback]
    refresh: 0s

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  manual_ip:
    static_ip: 192.168.1.150
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

eth_wifi_fallback:
  ssid: "YourHomeWiFi"
  password: "YourPassword"
  sta_timeout: 45s
  check_interval: 15s
  # ap_ssid: "HEUNG-Setup"
  # ap_password: "heungsetup"
  manual_ip:
    static_ip: 192.168.1.150
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

logger:
  level: DEBUG

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "REPLACE_OTA_PASSWORD"

web_server:
  port: 80

# ── Buttons (Home Assistant) ─────────────────────────────────
button:
  - platform: template
    name: "Clear saved WiFi (NVS)"
    icon: mdi:wifi-remove
    entity_category: config
    on_press:
      - eth_wifi_fallback.clear_wifi:

  - platform: template
    name: "Save factory WiFi"
    icon: mdi:wifi-lock
    entity_category: config
    on_press:
      - eth_wifi_fallback.save_wifi:
          ssid: "YourHomeWiFi"
          password: "YourPassword"

# ── Switch: force YAML WiFi (clears NVS when turned on) ───────
switch:
  - platform: template
    name: "Force YAML WiFi (clear NVS)"
    icon: mdi:wifi-sync
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - eth_wifi_fallback.clear_wifi:
      - logger.log: "NVS cleared — YAML SSID will be used on next STA"
    turn_off_action:
      - logger.log: "Force YAML switch off (NVS unchanged)"

