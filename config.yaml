esphome:
  name: "esp32-eth-wifi-fallback"
  friendly_name: ESP32 ETH WiFi Fallback

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: github://kemak92/eth_wifi_fallback@main
    components: [eth_wifi_fallback]
    refresh: 0s

# ====================== ETHERNET (Primary) ======================
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  # power_pin: GPIO16

  manual_ip:
    static_ip: 192.168.1.150
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 8.8.8.8

# ====================== FALLBACK: STA → AP ======================
eth_wifi_fallback:
  id: my_fallback

  # WiFi nhà (STA) — ưu tiên khi mất Ethernet
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  check_interval: 15s
  sta_timeout: 45s              # hết 45s không vào STA → bật AP

  # IP cố định khi chạy STA (cùng IP Ethernet cũng được)
  manual_ip:
    static_ip: 192.168.1.150
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

  # AP cứu hộ — để trống = tự sinh theo MAC + in PASS ra log
  # ap_ssid: "HEUNG-Rescue"
  # ap_password: "matkhaumanh123"   # nếu set phải ≥ 8 ký tự

# ====================== REST ======================
logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address (Ethernet)"
    mac_address:
      name: "MAC Address"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# Nút trên HA / Web: xóa WiFi đã lưu NVS → về YAML default
button:
  - platform: template
    name: "Reset WiFi to YAML default"
    on_press:
      - eth_wifi_fallback.clear_wifi:
          id: my_fallback

